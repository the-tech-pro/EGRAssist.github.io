<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- History Section (Data Analysis) -->
        <div id="history" class="tile">
            <h2>History</h2>
            <div id="lapButtonsContainer"></div>
        </div>

        <!-- Debug & Alerts Section -->
        <div id="debug" class="tile">
            <h2>Debug & Alerts</h2>
            <div id="debugLog"></div>
        </div>

        <!-- Live Dashboard Section -->
        <div id="liveDashboard" class="tile">
            <h2>Live Dashboard</h2>
            <div class="chart-container">
                <canvas id="liveChart"></canvas>
            </div>
        </div>

        <!-- Live Data Section -->
        <div id="liveData" class="tile">
            <h2>Live Data</h2>
            <div id="liveDataRoot"></div>
        </div>

        <!-- Control Panel Section -->
        <div id="controlPanel" class="tile">
            <h2>Control Panel</h2>
            <button id="startButton" class="btn">Start</button>
            <button id="stopButton" class="btn" disabled>Stop</button>
            <button id="lapButton" class="btn">Lap</button>
            <label><input type="checkbox" id="spoofData"> Spoof Data</label>
            <label><input type="checkbox" id="darkModeToggle"> Dark Mode</label>
        </div>
    </div>

    <!-- Lap Overlay -->
    <div id="lapOverlay" class="overlay">
        <div class="overlay-content">
            <div class="overlay-header">
                <h1 id="lapTitle">Lap</h1>
                <button id="closeLapOverlay" class="btn">Close</button>
            </div>
            <div class="chart-container">
                <canvas id="lapChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script type="text/babel" src="liveData.jsx"></script>
    <script src="main.js"></script>
</body>
</html>
